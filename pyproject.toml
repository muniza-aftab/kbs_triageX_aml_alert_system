[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triagex"
version = "0.1.0"
description = "A knowledge-based system that triages AML alerts and knows when to refuse to decide"
readme = "README.md"
authors = [{ name = "Muniza Aftab" }]
requires-python = ">=3.11"
license = { text = "MIT" }

# The core has no runtime dependencies. This is deliberate: the inference engine,
# the rule base, the search algorithms and the explanation facility are all
# written against the standard library, so `pip install -e .` is sufficient to
# run everything in the demo path.
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]                     # evaluation figures only
web = [                                       # the website; the core needs none of this
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "networkx>=3.2",                          # used ONLY to cross-validate the graph search
    "httpx>=0.27",                            # FastAPI TestClient
]

[project.scripts]
triagex = "triagex.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
triagex = ["data/cases/*.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "SIM",         # simplify
    "RET",         # returns
    "PTH",         # pathlib
    "RUF",
]
ignore = [
    "E501",        # line length is handled by the formatter
]
# The docstrings here are prose, and prose uses curly apostrophes and currency symbols.
allowed-confusables = ["’", "£"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src", "tests", "backend"]

[[tool.mypy.overrides]]
module = ["networkx.*", "matplotlib.*", "rich.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]          # tests run without an install step
addopts = "-q --strict-markers"
markers = [
    "slow: benchmarks and full evaluation runs",
]
